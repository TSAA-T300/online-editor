<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  繁體中文文件常用的 Windows 字型不能隨映像散布，改對應到 fonts-noto-cjk 的繁中版本。
  沒有這份設定時，微軟正黑體會被對應到只有拉丁字的 DejaVu Sans，中文字再由 LibreOffice 退回 Noto Sans CJK SC
  （簡體字形，且字寬與 Word 不同，造成頁數差異）。
-->
<fontconfig>
  <!-- 黑體類 -->
  <alias binding="same">
    <family>Microsoft JhengHei</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>微軟正黑體</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Microsoft JhengHei UI</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <!-- 明體類 -->
  <alias binding="same">
    <family>PMingLiU</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>新細明體</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>MingLiU</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>細明體</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <!-- 楷書類：沒有可散布的繁中楷書，退而用明體 -->
  <alias binding="same">
    <family>DFKai-SB</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>標楷體</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <!--
    Windows 的韓文字型：台灣的文件也會用到（例如標題用 Gungsuh 寫中文）。沒有對應時會落到只有拉丁字的
    DejaVu Sans，部分中文字顯示成方框（Issue #1237）。Noto CJK 各地區版本都含韓文字，對應到繁中版本，
    中文字形才是繁中寫法。明朝體（Gungsuh、Batang）對應明體，哥德體（Gulim、Dotum、Malgun Gothic）對應黑體
  -->
  <alias binding="same">
    <family>Gungsuh</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>GungsuhChe</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Batang</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>BatangChe</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Gulim</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>GulimChe</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Dotum</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>DotumChe</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Malgun Gothic</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
</fontconfig>
